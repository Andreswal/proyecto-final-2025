{% extends 'blog/base.html' %}

{% block title %}Eliminar articulo - Mi Blog{% endblock %}

{% block contenido %}

<main class="mb-4">
  <div class="container px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <h2>eliminar Artículo</h2>
        <p>¿Estás seguro que querés eliminar este artículo?</p>
        <p>{{ articulo.titulo }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Sí, eliminar</button>
            <a href="{% url 'detalle_articulo' articulo.id %}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</main>

{% endblock %}
